# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsce:
    name: VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: VS Code Marketplace
      url: https://marketplace.visualstudio.com/items?itemName=johnbillion.vscode-wordpress-hooks
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
    steps:
      - name: checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: clean install dependencies
        run: npm ci

      - name: deploy
        run: npm run deploy-vsce

  github:
    name: GitHub Milestones
    permissions:
      issues: write # Required for write access to milestones
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-milestones.yml@cc47e37177c694e00b901a5dc89fda5644bc550f # 2.9.1
    with:
      version: ${{ github.event.release.tag_name }}
